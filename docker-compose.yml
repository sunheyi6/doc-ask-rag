version: '3.8'

services:
  api:
    build: .
    container_name: rag-agent-api
    ports:
      - "8000:8000"
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-qwen-turbo}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-v1}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 可选: 前端服务
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: rag-agent-web
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
